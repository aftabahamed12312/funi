<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gurukul Meeting</title>
  <style>
    :root {
      --bg: #081426;
      --panel: #101d32;
      --panel-soft: #122742;
      --blue: #1e90ff;
      --teal: #38bdf8;
      --text: #edf6ff;
      --muted: #a9c4de;
      --danger: #ff6a7a;
      --card: #0b1730;
      --line: rgba(128, 161, 194, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px 24px 32px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 16px;
    }
    .eyebrow {
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    h2 {
      margin: 0;
      font-size: clamp(2rem, 2.3vw, 3rem);
    }
    .link-btn {
      color: var(--teal);
      text-decoration: none;
      font-weight: 700;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }
    .video-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 300px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 35px rgba(0,0,0,0.2);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .label {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(7, 15, 27, 0.85);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      border: 1px solid var(--line);
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 12px 0 16px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: linear-gradient(90deg, var(--blue), var(--teal));
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 20px rgba(21, 124, 232, 0.25);
    }
    button.secondary {
      background: rgba(21, 124, 232, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    button.danger {
      background: linear-gradient(90deg, #ff6a7a, #ff8a65);
    }
    .status {
      color: var(--muted);
      margin-top: 8px;
      min-height: 22px;
    }
    .room-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      align-items: start;
    }
    .panel {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }
    .panel-header {
      background: rgba(255,255,255,0.02);
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .chat-box {
      height: 280px;
      overflow-y: auto;
      padding: 14px;
      background: rgba(0,0,0,0.12);
    }
    .chat-message {
      margin-bottom: 12px;
      padding: 8px 10px;
      background: rgba(148, 163, 184, 0.08);
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    .chat-message strong {
      display: block;
      margin-bottom: 4px;
      color: var(--teal);
    }
    .chat-form {
      display: flex;
      border-top: 1px solid var(--line);
      padding: 10px;
      gap: 8px;
    }
    .chat-form input {
      flex: 1;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1730;
      color: var(--text);
      padding: 10px 12px;
    }
    .wb-wrap {
      padding: 12px;
    }
    canvas {
      width: 100%;
      height: 260px;
      display: block;
      border-radius: 12px;
      background: #f8fafc;
      border: 2px solid rgba(30, 144, 255, 0.2);
      cursor: crosshair;
    }
    .whiteboard-controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .whiteboard-controls input[type="color"] {
      width: 46px;
      height: 38px;
      border: none;
      background: transparent;
      padding: 0;
    }
    @media (max-width: 980px) {
      .room-layout { grid-template-columns: 1fr; }
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <p class="eyebrow">Self-hosted room</p>
        <h2>Room: {{ room_id }}</h2>
      </div>
      <a class="link-btn" href="{{ url_for('dashboard') }}">Back to dashboard</a>
    </div>

    <div class="video-grid">
      <div class="video-card">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="label">{{ user.name }} (You)</div>
      </div>
      <div class="video-card">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="label" id="remoteLabel">Classmate</div>
      </div>
    </div>

    <div class="tools">
      <button id="startMediaBtn">Allow Camera & Mic</button>
      <button id="toggleVideo" class="secondary">Mute Video</button>
      <button id="toggleAudio" class="secondary">Mute Audio</button>
      <button id="leaveBtn" class="danger">Leave Room</button>
    </div>
    <div id="status" class="status">Waiting for browser permission to use camera and microphone...</div>

    <div class="room-layout">
      <div class="panel">
        <div class="panel-header">Classroom Chat</div>
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-form">
          <input id="chatInput" type="text" placeholder="Type a message..." />
          <button id="sendChatBtn">Send</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">Whiteboard</div>
        <div class="wb-wrap">
          <canvas id="whiteboard" width="480" height="260"></canvas>
          <div class="whiteboard-controls">
            <input id="brushColor" type="color" value="#1e90ff" />
            <button id="clearBoardBtn" class="secondary">Clear</button>
            <button id="recordBtn" class="secondary">Start Recording</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    const socket = io();
    const roomId = '{{ room_id }}';
    const username = '{{ user.name }}';
    const userRole = '{{ user.role }}';
    const isInstructor = {{ is_host|tojson }};
    const scheduledInstructor = '{{ scheduled_instructor.name if scheduled_instructor else "Instructor" }}';

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusEl = document.getElementById('status');
    const startMediaBtn = document.getElementById('startMediaBtn');
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const brushColor = document.getElementById('brushColor');
    const clearBoardBtn = document.getElementById('clearBoardBtn');
    const recordBtn = document.getElementById('recordBtn');

    let localStream = null;
    let peerConnection = null;
    let currentPeerId = null;
    let roomHostId = null;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let liveKitRoom = null;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function offerStudentStream(studentId) {
      if (!isInstructor || !peerConnection || !studentId || peerConnection.signalingState !== 'stable') return;
      currentPeerId = studentId;
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('signal', { target: studentId, offer, room: roomId, from: socket.id });
      setStatus('Connecting the student to your live stream...');
    }

    function appendMessage(name, text) {
      const item = document.createElement('div');
      item.className = 'chat-message';
      item.innerHTML = `<strong>${name}</strong><div>${text}</div>`;
      chatBox.appendChild(item);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setupWhiteboard() {
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#1e90ff';

      function getPos(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (canvas.width / rect.width),
          y: (event.clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (userRole !== 'instructor' && userRole !== 'tenant_admin' && userRole !== 'superadmin') return;
        const pos = getPos(event);
        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!isDrawing) return;
        const pos = getPos(event);
        ctx.strokeStyle = brushColor.value;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        socket.emit('whiteboard_update', {
          room: roomId,
          x1: lastX,
          y1: lastY,
          x2: pos.x,
          y2: pos.y,
          color: brushColor.value
        });
        lastX = pos.x;
        lastY = pos.y;
      });

      canvas.addEventListener('pointerup', () => {
        isDrawing = false;
      });

      canvas.addEventListener('pointerleave', () => {
        isDrawing = false;
      });

      clearBoardBtn.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        socket.emit('whiteboard_update', {
          room: roomId,
          clear: true,
          color: brushColor.value
        });
      });

      socket.on('whiteboard_update', (data) => {
        if (data.clear) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }
        ctx.strokeStyle = data.color || '#1e90ff';
        ctx.beginPath();
        ctx.moveTo(data.x1, data.y1);
        ctx.lineTo(data.x2, data.y2);
        ctx.stroke();
      });
    }

    async function startLiveKit() {
      if (!window.LivekitClient) return false;
      try {
        const response = await fetch('/api/v1/live-sessions/' + encodeURIComponent(roomId) + '/livekit-token', { method: 'POST' });
        if (!response.ok) return false;
        const payload = await response.json();
        if (!payload.success || !payload.data?.token) return false;
        const { Room, RoomEvent } = window.LivekitClient;
        liveKitRoom = new Room();
        liveKitRoom.on(RoomEvent.TrackSubscribed, (track) => {
          track.attach(remoteVideo);
          document.getElementById('remoteLabel').textContent = scheduledInstructor;
          setStatus('Following the instructor live stream.');
        });
        liveKitRoom.on(RoomEvent.TrackUnsubscribed, (track) => track.detach(remoteVideo));
        liveKitRoom.on(RoomEvent.LocalTrackPublished, (publication) => {
          if (publication.track && publication.track.kind === 'video') publication.track.attach(localVideo);
        });
        await liveKitRoom.connect(payload.data.ws_url, payload.data.token);
        if (isInstructor) {
          await liveKitRoom.localParticipant.setCameraEnabled(true);
          await liveKitRoom.localParticipant.setMicrophoneEnabled(true);
          setStatus('You are live. Students can now follow your lecture.');
        } else {
          setStatus('Connected. Waiting for the instructor stream...');
        }
        startMediaBtn.textContent = isInstructor ? 'LiveKit Classroom Active' : 'Following Instructor';
        return true;
      } catch (error) {
        console.warn('LiveKit unavailable; using classroom fallback.', error);
        return false;
      }
    }

    async function startMedia() {
      if (await startLiveKit()) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (!window.isSecureContext) {
          setStatus('Camera is blocked because this page is not secure. Open http://localhost:5000 on this computer, or use HTTPS on the LAN.');
        } else {
          setStatus('Camera access is unavailable. Use a current Chrome, Edge, or Firefox browser.');
        }
        return;
      }

      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (window.location.protocol === 'http:' && !isLocalhost) {
        setStatus('Camera access is blocked on LAN IPs over HTTP. Open this page using localhost: http://localhost:5000/meeting/' + roomId);
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        setStatus('Camera and microphone are ready.');

        if (!peerConnection) {
          peerConnection = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
          });

          if (isInstructor) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
          } else {
            peerConnection.addTransceiver('video', { direction: 'recvonly' });
            peerConnection.addTransceiver('audio', { direction: 'recvonly' });
          }

          peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
            setStatus('Connected to the instructor live stream.');
          };

          peerConnection.onconnectionstatechange = () => {
            if (peerConnection.connectionState === 'connected') {
              setStatus('Teacher and student are connected.');
            } else if (peerConnection.connectionState === 'failed') {
              setStatus('Video connection failed. Click Allow Camera & Mic to reconnect.');
            } else if (peerConnection.connectionState === 'disconnected') {
              setStatus('Video connection lost. Reconnecting...');
            }
          };

          peerConnection.onicecandidate = (event) => {
            if (event.candidate && currentPeerId) {
              socket.emit('signal', { target: currentPeerId, candidate: event.candidate, room: roomId, from: socket.id });
            }
          };

          socket.on('room_host', (msg) => {
            roomHostId = msg.hostId;
            if (msg.hostName) {
              document.getElementById('remoteLabel').textContent = msg.hostName;
            }

            if (!isInstructor && roomHostId && roomHostId !== socket.id) {
              currentPeerId = roomHostId;
              setStatus('Instructor is connected. Waiting for teacher stream...');
            }
          });

          socket.on('system_message', (msg) => {
            setStatus(msg.text);
          });

          socket.on('room_users', (payload) => {
            const users = payload.users || {};
            const entries = Object.entries(users);
            if (isInstructor) {
              const student = entries.find(([id, user]) => id !== socket.id && (user.role === 'student' || user.role === 'tenant_admin'));
              if (student) {
                offerStudentStream(student[0]);
              }
            } else {
              const host = entries.find(([id, user]) => id !== socket.id && (user.role === 'instructor' || user.role === 'tenant_admin' || user.role === 'superadmin'));
              if (host) {
                currentPeerId = host[0];
                roomHostId = host[0];
                document.getElementById('remoteLabel').textContent = host[1].username || 'Instructor';
                setStatus('Instructor is connected. Waiting for teacher stream...');
              }
            }
          });

          socket.on('user-joined', (data) => {
            if (!isInstructor && (data.role === 'instructor' || data.role === 'tenant_admin' || data.role === 'superadmin')) {
              currentPeerId = data.userId;
              roomHostId = data.userId;
              document.getElementById('remoteLabel').textContent = data.username || 'Instructor';
              setStatus('Instructor is connected. Waiting for teacher stream...');
            }

            if (isInstructor && data.role === 'student') {
              offerStudentStream(data.userId);
            }
          });

          socket.on('user-left', (data) => {
            if (data.userId === currentPeerId) {
              currentPeerId = null;
              document.getElementById('remoteLabel').textContent = 'Classmate';
              remoteVideo.srcObject = null;
            }
          });

          socket.on('signal', async (data) => {
            if (data.from === socket.id) return;
            if (data.candidate) {
              try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
              } catch (error) {
                console.error(error);
              }
              return;
            }
            if (data.offer) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
              const answer = await peerConnection.createAnswer();
              await peerConnection.setLocalDescription(answer);
              socket.emit('signal', { target: data.from, answer, room: roomId, from: socket.id });
              return;
            }
            if (data.answer) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
          });

          socket.on('chat_message', (msg) => {
            appendMessage(msg.username, msg.text);
          });

          socket.emit('join_room', { room: roomId, username, role: userRole, is_host: isInstructor });
        }
      } catch (error) {
        console.error(error);
        setStatus('Permission denied. Please allow camera and microphone access in the browser and reload the page.');
      }
    }

    function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      appendMessage('You', text);
      socket.emit('chat_message', { room: roomId, username, text });
      chatInput.value = '';
    }

    function toggleRecording() {
      if (!localStream || !peerConnection) {
        setStatus('Camera is not active yet.');
        return;
      }

      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(localStream);
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'gurukul-class-recording.webm';
          a.click();
          setStatus('Recording saved.');
        };
        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = 'Stop Recording';
        setStatus('Recording started.');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.textContent = 'Start Recording';
      }
    }

    startMediaBtn.addEventListener('click', startMedia);
    window.addEventListener('load', startMedia);

    document.getElementById('leaveBtn').addEventListener('click', () => {
      window.location.href = '/dashboard';
    });

    document.getElementById('toggleVideo').addEventListener('click', () => {
      if (!localStream) {
        setStatus('Enable camera access first.');
        return;
      }
      const track = localStream.getVideoTracks()[0];
      if (track) track.enabled = !track.enabled;
    });

    document.getElementById('toggleAudio').addEventListener('click', () => {
      if (!localStream) {
        setStatus('Enable microphone access first.');
        return;
      }
      const track = localStream.getAudioTracks()[0];
      if (track) track.enabled = !track.enabled;
    });

    sendChatBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') sendChat();
    });
    recordBtn.addEventListener('click', toggleRecording);
    setupWhiteboard();
    appendMessage('System', 'Welcome to the live classroom.');
  </script>
</body>
</html>
